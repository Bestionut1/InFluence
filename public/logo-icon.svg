<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Brain tree with gradient -->
  <defs>
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Brain outline -->
  <g stroke="url(#brainGradient)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left hemisphere with branches -->
    <path d="M 80 50 Q 70 60 70 75 Q 70 90 80 100" />
    <path d="M 75 55 Q 65 65 65 80" />
    <path d="M 85 55 Q 85 70 80 85" />
    <path d="M 75 70 Q 60 75 55 85" />
    <path d="M 85 75 Q 75 80 70 95" />
    
    <!-- Right hemisphere with branches -->
    <path d="M 120 50 Q 130 60 130 75 Q 130 90 120 100" />
    <path d="M 125 55 Q 135 65 135 80" />
    <path d="M 115 55 Q 115 70 120 85" />
    <path d="M 125 70 Q 140 75 145 85" />
    <path d="M 115 75 Q 125 80 130 95" />
    
    <!-- Center trunk -->
    <path d="M 100 100 Q 98 110 100 120" />
    <path d="M 100 120 Q 95 130 90 140" />
    <path d="M 100 120 Q 105 130 110 140" />
    
    <!-- Root branches -->
    <path d="M 85 140 Q 80 150 75 160" />
    <path d="M 90 140 Q 88 155 90 165" />
    <path d="M 100 140 Q 100 155 100 165" />
    <path d="M 110 140 Q 112 155 110 165" />
    <path d="M 115 140 Q 120 150 125 160" />
  </g>
</svg>