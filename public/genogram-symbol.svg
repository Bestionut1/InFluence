<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#7ba87a" stroke-width="4"/>
  
  <!-- Top decorative leaves and berries -->
  <g>
    <!-- Left leaf -->
    <ellipse cx="85" cy="45" rx="6" ry="12" fill="#7ba87a" transform="rotate(-25 85 45)"/>
    <!-- Center leaf -->
    <ellipse cx="100" cy="35" rx="5" ry="14" fill="#9fb89f"/>
    <!-- Right leaf -->
    <ellipse cx="115" cy="45" rx="6" ry="12" fill="#7ba87a" transform="rotate(25 115 45)"/>
    
    <!-- Berries left -->
    <circle cx="75" cy="55" r="3" fill="#d4b896"/>
    <circle cx="70" cy="60" r="3" fill="#d4b896"/>
    <circle cx="78" cy="65" r="3" fill="#d4b896"/>
    
    <!-- Berries center -->
    <circle cx="100" cy="48" r="3" fill="#a4ac86"/>
    
    <!-- Berries right -->
    <circle cx="125" cy="55" r="3" fill="#d4b896"/>
    <circle cx="130" cy="60" r="3" fill="#d4b896"/>
    <circle cx="122" cy="65" r="3" fill="#d4b896"/>
  </g>
  
  <!-- Top three heads -->
  <circle cx="75" cy="95" r="10" fill="#5a9a7a"/>
  <circle cx="100" cy="90" r="11" fill="#9fb89f"/>
  <circle cx="125" cy="95" r="10" fill="#d4b896"/>
  
  <!-- Bottom interlocking circles (family bonds) -->
  <g>
    <!-- Left circle -->
    <circle cx="80" cy="130" r="18" fill="none" stroke="#5a9a7a" stroke-width="4"/>
    <!-- Center circle (overlapping) -->
    <circle cx="100" cy="135" r="18" fill="none" stroke="#9fb89f" stroke-width="4"/>
    <!-- Right circle (overlapping) -->
    <circle cx="120" cy="130" r="18" fill="none" stroke="#d4b896" stroke-width="4"/>
    
    <!-- Connecting line through center -->
    <line x1="75" y1="135" x2="125" y2="135" stroke="#7ba87a" stroke-width="2" opacity="0.5"/>
  </g>
</svg>